name: CI

# Site gates. Job names are the merge-guard floor; keep them.
# Playwright and Lighthouse run on ubuntu-24.04: Playwright cannot install
# Chromium on ubuntu-latest (26.04) yet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install 'pyyaml>=6.0'
      - name: Build the site and /v1 JSON from committed data
        run: python scripts/publish_static.py --out dist
      - name: Check every published JSON file parses and no observations leak
        run: |
          set -euo pipefail
          find dist/v1 -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
          test ! -e dist/v1/observations
          test -s dist/index.html

  test:
    name: Playwright Tests
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: pip install 'pyyaml>=6.0' && python scripts/publish_static.py --out dist
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/stci-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          npx playwright test
        env:
          BASE_URL: http://127.0.0.1:4173

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: pip install 'pyyaml>=6.0' && python scripts/publish_static.py --out dist
      - run: npm ci
      - name: Run Lighthouse on the landing page
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/stci-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          npx lighthouse http://127.0.0.1:4173/index.html --output=json --output-path=./lighthouse-results.json \
            --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo
      - name: Check scores (accessibility >= 95)
        run: |
          node -e "
          const r = require('./lighthouse-results.json');
          const s = k => Math.round(r.categories[k].score * 100);
          const hard = { accessibility: 95, 'best-practices': 90, seo: 90 };
          let bad = false;
          for (const [k, t] of Object.entries(hard)) { console.log(k, s(k)); if (s(k) < t) { console.error('FAIL ' + k); bad = true; } }
          console.log('performance (advisory)', s('performance'));
          if (bad) process.exit(1);"
